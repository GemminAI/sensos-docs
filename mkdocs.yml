site_name: SensOS Developer Portal
site_description: Official documentation portal for the SensOS ecosystem — RFC Series, Architecture, APIs, and Research
site_url: https://sensos.org
site_author: Gemmina Intelligence LLC.
repo_url: https://github.com/GemminAI/sensos-docs
repo_name: GemminAI/sensos-docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; Gemmina Intelligence LLC. — Pure Information Laboratory

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/eye-circle
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search:
      lang:
        - en
        - ja
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GemminAI/sensos-docs
      name: SensOS Docs
    - icon: fontawesome/brands/github
      link: https://github.com/GemminAI/nvs-runtime
      name: NVS Runtime
  generator: false

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - architecture/index.md
  - RFC:
      - rfc/index.md
      - RFC Map: rfc/RFC_MAP.md
      - RFC-0000: rfc/RFC-0000.md
      - RFC-0001: rfc/RFC-0001.md
      - RFC-0100: rfc/RFC-0100.md
      - RFC-0199: rfc/RFC-0199.md
      - RFC-0200: rfc/RFC-0200.md
      - RFC-0201: rfc/RFC-0201.md
      - RFC-0202: rfc/RFC-0202.md
      - RFC-0203: rfc/RFC-0203.md
  - Runtime:
      - runtime/index.md
  - Kernel:
      - kernel/index.md
  - HEKB:
      - hekb/index.md
  - Research:
      - research/index.md
  - Papers:
      - papers/index.md
  - Tutorials:
      - tutorials/index.md
  - API:
      - api/index.md
  - GitHub: https://github.com/GemminAI/sensos-docs
